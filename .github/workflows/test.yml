name: test

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # @deepseek-ai/schemastery is a peer dependency; installing it here is what
      # lets the host-half tests validate against the real schema engine.
      - run: npm install --no-audit --no-fund
      - run: npm test
      # Fails when lib/tones-data.js and the assets in assets/ have drifted apart.
      # tools/embed-tones.ps1 -Check does this on Windows; on Linux the same
      # comparison runs in node: see tools/check-embedded-tone.mjs.
      - run: node tools/check-embedded-tone.mjs
